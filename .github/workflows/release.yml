name: Release APK

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark GitHub Release as pre-release
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"
          cache: true

      - name: Read version from pubspec
        id: version
        run: |
          set -euo pipefail
          raw="$(sed -nE 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 | tr -d '\r')"
          if [[ ! "$raw" =~ ^([0-9]+\.[0-9]+\.[0-9]+-x)\+([1-9][0-9]*)$ ]]; then
            echo "Unexpected pubspec version format: $raw" >&2
            exit 1
          fi
          version_name="${BASH_REMATCH[1]}"
          version_code="${BASH_REMATCH[2]}"
          tag="v${version_name}"
          asset_name="meshcore-wardrive-xarleyn-${version_name}-${version_code}.apk"
          {
            echo "raw=${raw}"
            echo "version_name=${version_name}"
            echo "version_code=${version_code}"
            echo "tag=${tag}"
            echo "asset_name=${asset_name}"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing ${raw} as ${tag} (${asset_name})"

      - name: Ensure versionCode increases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          max_published_code=0
          while IFS= read -r asset_name; do
            if [[ "$asset_name" =~ -([0-9]+)\.apk$ ]] &&
               (( BASH_REMATCH[1] > max_published_code )); then
              max_published_code="${BASH_REMATCH[1]}"
            fi
          done < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[].assets[].name'
          )
          if (( VERSION_CODE <= max_published_code )); then
            echo "versionCode ${VERSION_CODE} must exceed published ${max_published_code}." >&2
            exit 1
          fi

      - name: Ensure release tag is free
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists. Bump pubspec.yaml first." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Git tag ${TAG} already exists on origin. Bump pubspec.yaml first." >&2
            exit 1
          fi

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/upload.jks
          test -s android/keystore/upload.jks

      - name: Write key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "Missing secret ${name}" >&2
              exit 1
            fi
          done
          # storeFile is resolved relative to android/app/
          printf '%s\n' \
            "storePassword=${ANDROID_KEYSTORE_PASSWORD}" \
            "keyPassword=${ANDROID_KEY_PASSWORD}" \
            "keyAlias=${ANDROID_KEY_ALIAS}" \
            "storeFile=../keystore/upload.jks" \
            > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Check version consistency
        run: dart run tool/version.dart check

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify release APK identity and signature
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          if [[ -z "$EXPECTED_CERT_SHA256" ]]; then
            echo "Missing secret ANDROID_CERT_SHA256" >&2
            exit 1
          fi
          apk="build/app/outputs/flutter-apk/app-release.apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          aapt="$build_tools/aapt"
          apksigner="$build_tools/apksigner"
          test -x "$aapt"
          test -x "$apksigner"

          badging="$($aapt dump badging "$apk" | head -n1)"
          [[ "$badging" == *"name='io.github.xarleyn.meshcore.wardrive'"* ]]
          [[ "$badging" == *"versionCode='${VERSION_CODE}'"* ]]
          [[ "$badging" == *"versionName='${VERSION_NAME}'"* ]]

          "$apksigner" verify --verbose "$apk"
          actual_cert="$($apksigner verify --print-certs "$apk" | sed -nE 's/^Signer #1 certificate SHA-256 digest: (.*)$/\1/p' | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          expected_cert="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$actual_cert" || "$actual_cert" != "$expected_cert" ]]; then
            echo "APK signer SHA-256 does not match ANDROID_CERT_SHA256." >&2
            exit 1
          fi

      - name: Prepare release asset
        env:
          ASSET_NAME: ${{ steps.version.outputs.asset_name }}
        run: |
          set -euo pipefail
          src="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$src"
          cp "$src" "$ASSET_NAME"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          ASSET_NAME: ${{ steps.version.outputs.asset_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          args=(gh release create "$TAG" "$ASSET_NAME"
            --title "$TAG"
            --notes "Signed release APK for ${VERSION_NAME} (versionCode ${VERSION_CODE})."
            --target "${{ github.sha }}"
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          "${args[@]}"
